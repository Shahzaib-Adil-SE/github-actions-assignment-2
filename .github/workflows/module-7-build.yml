
name: Module 7 - Build Custom Action

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: custom-action
        run: npm install

      - name: Bundle JavaScript action
        working-directory: custom-action
        run: npm run build

      - name: Commit bundled action
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f custom-action/dist/index.js
          git commit -m "Build Module 7 custom action" || echo "No changes to commit"
          git push
