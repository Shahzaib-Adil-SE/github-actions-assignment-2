name: Module 2C - Manual Workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Enter your name'
        required: true
        default: 'Student'
        type: string
      greeting:
        description: 'Enter greeting message'
        required: true
        default: 'Hello'
        type: string
      data:
        description: 'Enter additional data'
        required: true
        default: 'GitHub Actions Assignment'
        type: string

jobs:
  manual-job:
    runs-on: ubuntu-latest
    steps:
      - name: Display manual inputs
        env:
          INPUT_NAME: ${{ inputs.name }}
          INPUT_GREETING: ${{ inputs.greeting }}
          INPUT_DATA: ${{ inputs.data }}
        run: |
          echo "$INPUT_GREETING, $INPUT_NAME!"
          echo "Data: $INPUT_DATA"
          echo "Event: ${{ github.event_name }}"
