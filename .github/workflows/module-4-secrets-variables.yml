
name: Module 4 - Secrets and Variables

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-variables-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Display repository variable
        env:
          COURSE_NAME: ${{ vars.COURSE_NAME }}
        run: |
          echo "Course: $COURSE_NAME"

      - name: Verify secret is available safely
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret DEMO_SECRET is available."
            echo "Secret value is hidden."
          else
            echo "Secret DEMO_SECRET is missing."
            exit 1
          fi
