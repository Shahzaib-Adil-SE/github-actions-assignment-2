
name: Module 3 - Context Objects and Expressions

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  STUDENT_COURSE: DevOps Assignment 2

jobs:
  context-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Display GitHub Context
        run: |
          echo "GitHub Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Branch or Ref: ${{ github.ref }}"

      - name: Display Runner Context
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Architecture: ${{ runner.arch }}"

      - name: Display Environment Variable
        run: |
          echo "Course: $STUDENT_COURSE"

      - name: Conditional Success Step
        if: success()
        run: echo "Previous steps succeeded."

      - name: Conditional Failure Step
        if: failure()
        run: echo "A previous step failed."
